# A version tag builds the desktop app for all three systems on GitHub's own
# machines and publishes them to this repo's Releases -- which is also where
# installed copies look for their updates.
#
#   write build/release-notes.md (a short plain list: it becomes the Release's
#   text AND the installed app's update tip), bump "version" in package.json and
#   merge it to main. That is the whole
#   step: a push to main whose version has no v<version> tag yet releases it,
#   and electron-builder creates the tag with the release. Pushing a tag by
#   hand (git tag v0.3.1 && git push origin v0.3.1) still works too. The main
#   route exists because Claude sessions cannot push tags through their proxy.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  # On main, release only a version that has not been released yet; every
  # other push to main is a no-op here.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo release=true >> "$GITHUB_OUTPUT"; exit 0; fi
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "$v is already released"; echo release=false >> "$GITHUB_OUTPUT"
          else
            echo "releasing $v"; echo release=true >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag and package.json must agree, or the updater compares the
      # wrong versions and never offers the update. (On main the tag is made
      # FROM package.json, so there is nothing to compare.)
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID: build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # The Microsoft Store package, attached to the same Release for uploading in
  # Partner Center (Dex: Apps and games > Mobius 3D > the submission's
  # Packages page). Skipped until desktop/store.json carries the identity
  # Partner Center gave the app. It is NOT something to install from GitHub:
  # unsigned, Windows refuses it outside the Store.
  store:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: identity
        shell: bash
        run: echo "ready=$(node -p "Boolean(require('./desktop/store.json').identityName)")" >> "$GITHUB_OUTPUT"
      - if: steps.identity.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.identity.outputs.ready == 'true'
        run: npm ci
      - if: steps.identity.outputs.ready == 'true'
        run: npm run dist:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: steps.identity.outputs.ready == 'true'
        shell: bash
        run: gh release upload "v$(node -p "require('./package.json').version")" release/Mobius-3D-Store.appx --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
