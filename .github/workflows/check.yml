# Every push: build the viewer and drive it in Chrome.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test verification/background.test.mjs verification/capture.test.mjs
      - run: node verification/check.mjs
        env:
          CHROME: /usr/bin/google-chrome
